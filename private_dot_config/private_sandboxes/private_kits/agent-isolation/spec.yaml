# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Agent isolation label
description: Shows the isolation layer (microvm) in the Claude status line, using the host's ~/.ai/bin/agent-isolation.

# The label script comes from the mounted ~/.ai, like the global-agents kit, so
# it needs ~/.ai mounted in the sandbox (additionalWorkspaces in ~/.sbxenv.yaml).
# This kit only ever runs in an sbx sandbox, so it declares the layer with
# --layer microvm instead of relying on IS_SANDBOX being set for the status line.
# Claude's settings.json is merged, not replaced, so Docker's own keys stay.
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - description: Set the Claude status line to the isolation label
          command: |
            script="$HOME/.ai/bin/agent-isolation"
            if [ ! -r "$script" ]; then
              echo "agent-isolation: $script not found, is ~/.ai mounted?" >&2
              exit 0
            fi
            if ! command -v jq >/dev/null 2>&1; then
              echo "agent-isolation: jq not found, status line not set" >&2
              exit 0
            fi
            dir="${CLAUDE_CONFIG_DIR:-$HOME/.claude}"
            f="$dir/settings.json"
            mkdir -p "$dir" || exit 0
            [ -s "$f" ] || echo '{}' >"$f" || exit 0
            tmp=$(mktemp) || exit 0
            if jq '.statusLine = {"type": "command", "command": "bash ~/.ai/bin/agent-isolation --agent claude --layer microvm"}' "$f" >"$tmp"; then
              cat "$tmp" >"$f" || echo "agent-isolation: cannot update $f" >&2
            else
              echo "agent-isolation: cannot read $f as JSON, status line not set" >&2
            fi
            rm -f "$tmp"
            exit 0
