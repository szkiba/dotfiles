# Every xk6-* extension. The bulk of the estate, and indivisible by
# import — take all of them or none. Slice with tags instead.
projects:
  xk6-example:
    url: https://github.com/grafana/xk6-example.git
    path: ${PWD}/xk6-example
    desc: Example k6 extension
    tags:
      - kex
      - official
      - javascript
      - example

  xk6-output-example:
    url: https://github.com/grafana/xk6-output-example.git
    path: ${PWD}/xk6-output-example
