    path: ${PWD}/xk6-dashboard
    desc: A k6 extension that makes k6 metrics available on a web-based dashboard
    tags:
      - kex
      - official
      - output
      - o11y
      - archived

  xk6-dashboard-assets:
    url: https://github.com/grafana/xk6-dashboard-assets.git
    path: ${PWD}/xk6-dashboard-assets
